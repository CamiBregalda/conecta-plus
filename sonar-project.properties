sonar.organization=camibregalda
sonar.projectKey=CamiBregalda_conecta-plus
sonar.projectName=Conecta Plus

# Código-fonte: a SPA (js/) e os scripts do pipeline (scripts/)
sonar.sources=js,scripts
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.mjs

# Cobertura gerada por "npm run coverage" (formato lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fora do cálculo de cobertura: código de interface (DOM, sem testes unitários) e scripts de apoio ao pipeline.
sonar.coverage.exclusions=js/main.js,js/router.js,js/dados.js,js/componentes.js,js/views/**,scripts/build.mjs,scripts/lint.mjs,scripts/coverage.mjs

sonar.sourceEncoding=UTF-8

# Configuração do nginx para servir a SPA (arquivos estáticos).
# A navegação usa hash (#/rota), então não é necessário "fallback" para o index.html.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão de texto
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Verificação de saúde do container (usada pelo HEALTHCHECK do Dockerfile)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A página inicial e os dados sempre são revalidados; assim uma nova versão aparece logo.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        # add_header em um bloco "location" substitui os do nível superior; repetimos os de segurança.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
